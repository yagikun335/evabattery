<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バッテリー活動限界タイマー</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <h1>活動限界タイマー</h1>

    <button id="refresh-button">更新</button>
  </div>
  <script src="./script.js"></script>
</body>
</html>
